# Every customer action proxies Magento's default customer REST API - no
# custom module. LOG_LEVEL is info (not debug like most packages): customer
# searches put names/emails in request URLs, and AdobeCommerceClient only
# writes full URLs and Magento error bodies at debug level.
list:
  function: ../../actions/customer/list/index.js
  web: "yes"
  runtime: nodejs:20
  inputs:
    LOG_LEVEL: info
    COMMERCE_BASE_URL: $COMMERCE_BASE_URL
    COMMERCE_CONSUMER_KEY: $COMMERCE_CONSUMER_KEY
    COMMERCE_CONSUMER_SECRET: $COMMERCE_CONSUMER_SECRET
    COMMERCE_ACCESS_TOKEN: $COMMERCE_ACCESS_TOKEN
    COMMERCE_ACCESS_TOKEN_SECRET: $COMMERCE_ACCESS_TOKEN_SECRET

  annotations:
    require-adobe-auth: true
    final: true

