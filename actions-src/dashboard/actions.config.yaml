# Dashboard headline numbers - read-only proxies to Magento's default REST API
# (plus Kinex_ZLF31QCAN for active admins, which Magento has no API for).
stats:
  function: ../../actions/dashboard/stats/index.js
  web: "yes"
  runtime: nodejs:20
  inputs:
    LOG_LEVEL: info
    COMMERCE_BASE_URL: $COMMERCE_BASE_URL
    COMMERCE_CONSUMER_KEY: $COMMERCE_CONSUMER_KEY
    COMMERCE_CONSUMER_SECRET: $COMMERCE_CONSUMER_SECRET
    COMMERCE_ACCESS_TOKEN: $COMMERCE_ACCESS_TOKEN
    COMMERCE_ACCESS_TOKEN_SECRET: $COMMERCE_ACCESS_TOKEN_SECRET

  annotations:
    require-adobe-auth: true
    final: true
