# Invoked by Adobe I/O Events, not the frontend - same shape as
# product/events-consumer (web: "no", no Commerce credentials needed, the
# event payload already carries everything this needs).
# require-adobe-auth stays false: it only applies to web actions (aio ignores
# it on non-web ones, with a warning), and a non-web action has no public URL -
# it can only be invoked with this namespace's own Runtime credentials.
events-consumer:
  function: ../../actions/order/events-consumer/index.js
  web: "no"
  runtime: nodejs:20
  inputs:
    LOG_LEVEL: debug

  annotations:
    require-adobe-auth: false
    final: true
